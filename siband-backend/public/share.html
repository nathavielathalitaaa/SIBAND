<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Rekap untuk Terapis - Siband</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }
    body {
      background-color: #F6F4EF;
      color: #1E2A24;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      padding: 20px 16px 36px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }
    .brand-header {
      background-color: #E3EEDF;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(30, 42, 36, 0.06);
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .brand-top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }
    .brand-identity {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1 1 220px;
    }
    .brand-logo {
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      display: block;
    }
    .brand-titles {
      min-width: 0;
    }
    .brand-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #1F5C4A;
      line-height: 1.2;
    }
    .brand-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1E2A24;
      line-height: 1.25;
      margin-top: 2px;
    }
    .header-sub {
      font-size: 15px;
      color: rgba(30, 42, 36, 0.8);
      margin-top: 4px;
      overflow-wrap: anywhere;
    }
    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .badge-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(31, 92, 74, 0.14);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      background-color: #1F5C4A;
      color: #F6F4EF;
    }
    .privacy-note {
      font-size: 14px;
      color: rgba(30, 42, 36, 0.82);
    }
    .print-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 16px;
      border: 0;
      border-radius: 12px;
      background-color: #1F5C4A;
      color: #F6F4EF;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(31, 92, 74, 0.22);
    }
    .print-btn:hover {
      background-color: rgba(31, 92, 74, 0.9);
    }
    .print-btn:focus-visible {
      outline: 3px solid #1E2A24;
      outline-offset: 2px;
    }
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    .grid-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 0;
    }
    .card {
      background-color: #E3EEDF;
      border-radius: 20px;
      box-shadow: 0 4px 14px rgba(30, 42, 36, 0.06);
      padding: 20px;
      min-width: 0;
    }
    .card-amber {
      background-color: rgba(232, 162, 79, 0.14);
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #1E2A24;
      line-height: 1.3;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .stat-box {
      background-color: #F6F4EF;
      border-radius: 14px;
      padding: 14px;
      min-width: 0;
    }
    .stat-label {
      font-size: 13px;
      color: rgba(30, 42, 36, 0.78);
      margin-bottom: 6px;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #1F5C4A;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .baseline-insufficient {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 12px;
      background-color: rgba(217, 222, 214, 0.65);
      color: #1E2A24;
      font-size: 15px;
      font-weight: 500;
    }
    .chart-container {
      width: 100%;
      overflow-x: auto;
      padding: 12px 8px 6px;
      background-color: #F6F4EF;
      border-radius: 14px;
    }
    .trend-svg {
      display: block;
      height: 176px;
      min-width: 100%;
    }
    .chart-legend {
      display: flex;
      gap: 10px 18px;
      margin-top: 14px;
      font-size: 14px;
      color: rgba(30, 42, 36, 0.82);
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      flex: 0 0 12px;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .type-tag {
      padding: 6px 12px;
      border-radius: 9999px;
      background-color: #E3EEDF;
      color: #1F5C4A;
      font-size: 13px;
      font-weight: 600;
    }
    .event-item {
      padding: 14px;
      border-radius: 14px;
      background-color: #F6F4EF;
      margin-bottom: 10px;
    }
    .event-item:last-child {
      margin-bottom: 0;
    }
    .event-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px 12px;
      margin-bottom: 6px;
    }
    .event-type {
      font-size: 15px;
      font-weight: 700;
      color: #1E2A24;
    }
    .event-time {
      font-size: 13px;
      color: rgba(30, 42, 36, 0.78);
    }
    .event-note {
      font-size: 15px;
      color: rgba(30, 42, 36, 0.88);
      overflow-wrap: anywhere;
    }
    .empty-text {
      font-size: 15px;
      color: rgba(30, 42, 36, 0.78);
      text-align: center;
      padding: 20px 12px;
      background-color: #F6F4EF;
      border-radius: 14px;
    }
    .footer-note {
      font-size: 13px;
      color: rgba(30, 42, 36, 0.78);
      text-align: center;
      line-height: 1.55;
      margin-top: 20px;
      padding: 14px 16px;
      background-color: rgba(217, 222, 214, 0.35);
      border-radius: 16px;
    }
    .state-wrapper {
      width: 100%;
      max-width: 480px;
      margin: 48px auto;
    }
    .state-message {
      padding: 40px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .state-icon-box {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background-color: #F6F4EF;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .state-title {
      font-size: 18px;
      font-weight: 600;
      color: #1E2A24;
      line-height: 1.4;
    }
    .spin-svg {
      animation: spin 1.2s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .spin-svg {
        animation: none;
      }
    }
    @media (min-width: 700px) {
      body {
        padding: 28px 24px 44px;
      }
      .container {
        max-width: 720px;
      }
      .card-title {
        font-size: 19px;
      }
      .stat-value {
        font-size: 24px;
      }
    }
    @media (min-width: 900px) {
      body {
        padding: 32px 28px 48px;
      }
      .container {
        max-width: 1080px;
      }
      .brand-header {
        padding: 24px 28px;
        margin-bottom: 24px;
      }
      .brand-header h1 {
        font-size: 24px;
      }
      .content-grid {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
        gap: 24px;
      }
      .grid-column {
        gap: 24px;
      }
      .card {
        padding: 24px;
      }
      .card-title {
        font-size: 20px;
      }
      .stat-value {
        font-size: 26px;
      }
      .trend-svg {
        height: 220px;
      }
    }
    @media print {
      @page {
        margin: 14mm;
      }
      body {
        background-color: #FFFFFF;
        color: #000000;
        padding: 0;
        font-size: 14px;
      }
      .container {
        max-width: 100%;
      }
      .brand-header,
      .card,
      .card-amber,
      .stat-box,
      .event-item,
      .chart-container,
      .empty-text,
      .footer-note {
        background-color: #FFFFFF;
        color: #000000;
        box-shadow: none;
        border: 1px solid #D9DED6;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .print-btn {
        display: none;
      }
      .content-grid {
        display: block;
      }
      .grid-column {
        display: block;
      }
      .card,
      .brand-header {
        margin-bottom: 14px;
      }
      .brand-name,
      .brand-header h1,
      .header-sub,
      .privacy-note,
      .card-title,
      .stat-label,
      .stat-value,
      .event-type,
      .event-time,
      .event-note,
      .chart-legend,
      .footer-note {
        color: #000000;
      }
      .badge,
      .type-tag,
      .baseline-insufficient {
        background-color: #FFFFFF;
        color: #000000;
        border: 1px solid #1E2A24;
      }
    }
  </style>
</head>
<body>
  <main class="container" id="app" aria-live="polite">
    <div class="state-wrapper">
      <div class="card state-message" id="loading-card" role="status">
        <div class="state-icon-box" aria-hidden="true">
          <svg class="spin-svg" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
            <circle cx="14" cy="14" r="10" fill="none" stroke="#D9DED6" stroke-width="3"></circle>
            <path d="M14 4 A10 10 0 0 1 24 14" fill="none" stroke="#1F5C4A" stroke-width="3" stroke-linecap="round"></path>
          </svg>
        </div>
        <h1 class="state-title">Memuat data rekap...</h1>
      </div>
    </div>
  </main>

  <script>
    (function() {
      var app = document.getElementById('app');
      var svgNS = 'http://www.w3.org/2000/svg';

      // 1. Baca token dari location.hash (bagian setelah #), BUKAN dari path atau query
      var rawHash = window.location.hash || '';
      var token = rawHash.indexOf('#') === 0 ? rawHash.substring(1) : rawHash;

      // 2. Segera hapus hash dari address bar setelah dibaca (history.replaceState)
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
      }

      function createSvgEl(tag, attrs) {
        var el = document.createElementNS(svgNS, tag);
        if (attrs) {
          var keys = Object.keys(attrs);
          for (var i = 0; i < keys.length; i++) {
            el.setAttribute(keys[i], attrs[keys[i]]);
          }
        }
        return el;
      }

      function createBrandLogoSvg() {
        var svg = createSvgEl('svg', {
          'class': 'brand-logo',
          'width': '40',
          'height': '40',
          'viewBox': '0 0 40 40',
          'aria-hidden': 'true'
        });
        svg.appendChild(createSvgEl('rect', {
          'x': '0',
          'y': '0',
          'width': '40',
          'height': '40',
          'rx': '11',
          'fill': '#E3EEDF',
          'stroke': '#D9DED6',
          'stroke-width': '1'
        }));
        svg.appendChild(createSvgEl('path', {
          'd': 'M28.8 10 C22.4 6.4 10.4 8 10.4 14.4 C10.4 19.2 16 19.2 18.4 19.2 L21.2 14 L24 22 C29.6 23.2 30.4 31.2 20.8 32 C15.2 32.4 10.8 30.4 9.6 28.8',
          'fill': 'none',
          'stroke': '#1F5C4A',
          'stroke-width': '3.2',
          'stroke-linecap': 'round',
          'stroke-linejoin': 'round'
        }));
        svg.appendChild(createSvgEl('circle', {
          'cx': '21.2',
          'cy': '14',
          'r': '3',
          'fill': '#E8A24F'
        }));
        return svg;
      }

      function createErrorIconSvg() {
        var svg = createSvgEl('svg', {
          'width': '28',
          'height': '28',
          'viewBox': '0 0 28 28',
          'aria-hidden': 'true'
        });
        svg.appendChild(createSvgEl('circle', {
          'cx': '14',
          'cy': '14',
          'r': '11',
          'fill': 'none',
          'stroke': '#E8A24F',
          'stroke-width': '2.4'
        }));
        svg.appendChild(createSvgEl('line', {
          'x1': '14',
          'y1': '8.5',
          'x2': '14',
          'y2': '15.5',
          'stroke': '#1E2A24',
          'stroke-width': '2.4',
          'stroke-linecap': 'round'
        }));
        svg.appendChild(createSvgEl('circle', {
          'cx': '14',
          'cy': '19.5',
          'r': '1.5',
          'fill': '#1E2A24'
        }));
        return svg;
      }

      function createPrintIconSvg() {
        var svg = createSvgEl('svg', {
          'width': '16',
          'height': '16',
          'viewBox': '0 0 24 24',
          'aria-hidden': 'true'
        });
        svg.appendChild(createSvgEl('path', {
          'd': 'M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z',
          'fill': 'none',
          'stroke': '#F6F4EF',
          'stroke-width': '2',
          'stroke-linecap': 'round',
          'stroke-linejoin': 'round'
        }));
        return svg;
      }

      function showErrorState() {
        while (app.firstChild) {
          app.removeChild(app.firstChild);
        }
        var wrapper = document.createElement('div');
        wrapper.className = 'state-wrapper';

        var errorCard = document.createElement('div');
        errorCard.className = 'card card-amber state-message';
        errorCard.setAttribute('role', 'status');

        var iconBox = document.createElement('div');
        iconBox.className = 'state-icon-box';
        iconBox.setAttribute('aria-hidden', 'true');
        iconBox.appendChild(createErrorIconSvg());
        errorCard.appendChild(iconBox);

        var title = document.createElement('h1');
        title.className = 'state-title';
        title.textContent = 'Tautan tidak ditemukan atau sudah tidak berlaku.';
        errorCard.appendChild(title);

        wrapper.appendChild(errorCard);
        app.appendChild(wrapper);
      }

      // Validasi token ada dan tidak kosong
      if (!token || token.trim().length === 0) {
        showErrorState();
        return;
      }

      // 3. Fetch GET ke "/api/share/" + token
      fetch('/api/share/' + encodeURIComponent(token.trim()), {
        method: 'GET',
        headers: {
          'Accept': 'application/json'
        }
      })
      .then(function(res) {
        if (!res.ok) {
          throw new Error('HTTP ' + res.status);
        }
        return res.json();
      })
      .then(function(data) {
        renderPage(data);
      })
      .catch(function() {
        showErrorState();
      });

      var typeNameMap = {
        'suara_keras': 'Suara keras',
        'perubahan_aktivitas': 'Perubahan aktivitas',
        'transisi': 'Transisi kegiatan',
        'aktivitas_sulit': 'Aktivitas sulit',
        'interaksi_sosial': 'Interaksi sosial',
        'lainnya': 'Lainnya',
        'meltdown': 'Meltdown',
        'aktivitas_fisik': 'Aktivitas fisik'
      };

      function formatIndonesianDate(isoString) {
        if (!isoString) return '-';
        try {
          var d = new Date(isoString);
          if (isNaN(d.getTime())) return isoString;
          var pad = function(n) { return n < 10 ? '0' + n : n; };
          return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        } catch (_) {
          return isoString;
        }
      }

      function formatMonthPeriod(periodStr) {
        if (!periodStr) return '';
        var parts = periodStr.split('-');
        if (parts.length === 2) {
          var monthNames = [
            'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
            'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
          ];
          var monthIdx = parseInt(parts[1], 10) - 1;
          if (monthIdx >= 0 && monthIdx < 12) {
            return monthNames[monthIdx] + ' ' + parts[0];
          }
        }
        return periodStr;
      }

      function createStatBox(label, value) {
        var box = document.createElement('div');
        box.className = 'stat-box';
        var lbl = document.createElement('div');
        lbl.className = 'stat-label';
        lbl.textContent = label;
        var val = document.createElement('div');
        val.className = 'stat-value';
        val.textContent = value;
        box.appendChild(lbl);
        box.appendChild(val);
        return box;
      }

      function renderPage(payload) {
        while (app.firstChild) {
          app.removeChild(app.firstChild);
        }

        var nickname = payload.nickname || 'Anak';
        var periode = payload.periode || '';
        var rekap = payload.rekap || {};
        var baseline = rekap.baseline || {};
        var ringkasanPerHari = rekap.ringkasan_per_hari || [];
        var catatanKejadian = rekap.catatan_kejadian || {};
        var catatanDaftar = catatanKejadian.daftar || rekap.daftar_catatan || [];
        var catatanPerTipe = catatanKejadian.per_tipe || rekap.catatan_per_tipe || {};

        var isBaselineSufficient = Boolean(baseline && baseline.sufficient);

        // Header Merek
        var header = document.createElement('header');
        header.className = 'brand-header';

        var brandTop = document.createElement('div');
        brandTop.className = 'brand-top';

        var brandIdentity = document.createElement('div');
        brandIdentity.className = 'brand-identity';
        brandIdentity.appendChild(createBrandLogoSvg());

        var brandTitles = document.createElement('div');
        brandTitles.className = 'brand-titles';

        var brandName = document.createElement('div');
        brandName.className = 'brand-name';
        brandName.textContent = 'Siband';
        brandTitles.appendChild(brandName);

        var h1 = document.createElement('h1');
        h1.textContent = 'Rekap untuk terapis';
        brandTitles.appendChild(h1);

        var sub = document.createElement('div');
        sub.className = 'header-sub';
        sub.textContent = nickname + (periode ? ' \u2022 Periode ' + formatMonthPeriod(periode) : '');
        brandTitles.appendChild(sub);

        brandIdentity.appendChild(brandTitles);
        brandTop.appendChild(brandIdentity);

        var actions = document.createElement('div');
        actions.className = 'header-actions';

        var printBtn = document.createElement('button');
        printBtn.type = 'button';
        printBtn.className = 'print-btn';
        printBtn.appendChild(createPrintIconSvg());
        var printLabel = document.createElement('span');
        printLabel.textContent = 'Cetak / Simpan PDF';
        printBtn.appendChild(printLabel);
        printBtn.addEventListener('click', function() {
          window.print();
        });
        actions.appendChild(printBtn);

        brandTop.appendChild(actions);
        header.appendChild(brandTop);

        var badgeRow = document.createElement('div');
        badgeRow.className = 'badge-row';

        var badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = 'Tautan baca-saja';
        badgeRow.appendChild(badge);

        var privacyNote = document.createElement('span');
        privacyNote.className = 'privacy-note';
        privacyNote.textContent = 'Tautan baca-saja. Data bersifat pribadi.';
        badgeRow.appendChild(privacyNote);

        header.appendChild(badgeRow);
        app.appendChild(header);

        // Wadah dua kolom desktop (>= 900px)
        var contentGrid = document.createElement('div');
        contentGrid.className = 'content-grid';

        var leftCol = document.createElement('div');
        leftCol.className = 'grid-column';

        var rightCol = document.createElement('div');
        rightCol.className = 'grid-column';

        // Kolom Kiri - Card 1: Ringkasan Aktivitas
        var summaryCard = document.createElement('section');
        summaryCard.className = 'card';

        var summaryTitle = document.createElement('h2');
        summaryTitle.className = 'card-title';
        summaryTitle.textContent = 'Ringkasan Aktivitas';
        summaryCard.appendChild(summaryTitle);

        var grid = document.createElement('div');
        grid.className = 'stats-grid';
        grid.appendChild(createStatBox('Rata-rata BPM', rekap.rata_rata != null ? rekap.rata_rata + ' BPM' : '-'));
        grid.appendChild(createStatBox('Maksimum BPM', rekap.maksimum != null ? rekap.maksimum + ' BPM' : '-'));
        grid.appendChild(createStatBox('Jumlah Bacaan', (rekap.jumlah_sampel != null ? rekap.jumlah_sampel : 0) + ' sampel'));
        grid.appendChild(createStatBox('Hari Tersinkron', (rekap.jumlah_hari != null ? rekap.jumlah_hari : 0) + ' hari'));
        summaryCard.appendChild(grid);
        leftCol.appendChild(summaryCard);

        // Kolom Kiri - Card 2: Baseline Detak Jantung
        var baselineCard = document.createElement('section');
        baselineCard.className = 'card';

        var baselineTitle = document.createElement('h2');
        baselineTitle.className = 'card-title';
        baselineTitle.textContent = 'Baseline Detak Jantung';
        baselineCard.appendChild(baselineTitle);

        if (isBaselineSufficient) {
          var bGrid = document.createElement('div');
          bGrid.className = 'stats-grid';
          bGrid.appendChild(createStatBox('P25 (Batas Bawah)', baseline.p25 != null ? baseline.p25 + ' BPM' : '-'));
          bGrid.appendChild(createStatBox('Median (Tipikal)', baseline.median != null ? baseline.median + ' BPM' : '-'));
          bGrid.appendChild(createStatBox('P75 (Batas Atas)', baseline.p75 != null ? baseline.p75 + ' BPM' : '-'));
          bGrid.appendChild(createStatBox('Masa Analisis', (baseline.days_used || 30) + ' hari'));
          baselineCard.appendChild(bGrid);
        } else {
          var noBase = document.createElement('div');
          noBase.className = 'baseline-insufficient';
          noBase.textContent = 'Baseline belum cukup data';
          baselineCard.appendChild(noBase);
        }
        leftCol.appendChild(baselineCard);

        // Kolom Kanan - Card 3: Tren Detak Jantung Harian
        var chartCard = document.createElement('section');
        chartCard.className = 'card';

        var chartTitle = document.createElement('h2');
        chartTitle.className = 'card-title';
        chartTitle.textContent = 'Tren Detak Jantung Harian';
        chartCard.appendChild(chartTitle);

        if (ringkasanPerHari.length === 0) {
          var emptyChart = document.createElement('div');
          emptyChart.className = 'empty-text';
          emptyChart.textContent = 'Belum ada data';
          chartCard.appendChild(emptyChart);
        } else {
          var chartWrapper = document.createElement('div');
          chartWrapper.className = 'chart-container';

          var svgWidth = Math.max(360, ringkasanPerHari.length * 40 + 48);
          var svgHeight = 220;
          var padLeft = 32;
          var padBottom = 30;
          var padTop = 24;
          var usableHeight = svgHeight - padTop - padBottom;

          var maxVal = 140;
          for (var i = 0; i < ringkasanPerHari.length; i++) {
            var itemVal = ringkasanPerHari[i].rata_rata || 0;
            if (itemVal > maxVal) maxVal = itemVal + 10;
          }

          var svg = createSvgEl('svg', {
            'class': 'trend-svg',
            'viewBox': '0 0 ' + svgWidth + ' ' + svgHeight,
            'width': svgWidth.toString(),
            'role': 'img',
            'aria-label': 'Grafik batang tren detak jantung harian'
          });

          // Garis sumbu horizontal dasar
          svg.appendChild(createSvgEl('line', {
            'x1': padLeft.toString(),
            'y1': (svgHeight - padBottom).toString(),
            'x2': svgWidth.toString(),
            'y2': (svgHeight - padBottom).toString(),
            'stroke': '#D9DED6',
            'stroke-width': '1.5'
          }));

          var barWidth = 20;
          var step = (svgWidth - padLeft - 12) / ringkasanPerHari.length;

          for (var d = 0; d < ringkasanPerHari.length; d++) {
            var dayData = ringkasanPerHari[d];
            var dayAvg = dayData.rata_rata || 0;
            var dayAbove = dayData.bacaan_di_atas_p75 || 0;
            var isAlertDay = isBaselineSufficient && dayAbove > 0;

            var barH = Math.max(6, (dayAvg / maxVal) * usableHeight);
            var xPos = padLeft + d * step + (step - barWidth) / 2;
            var yPos = (svgHeight - padBottom) - barH;

            svg.appendChild(createSvgEl('rect', {
              'x': xPos.toFixed(1),
              'y': yPos.toFixed(1),
              'width': barWidth.toString(),
              'height': barH.toFixed(1),
              'rx': '5',
              'fill': isAlertDay ? '#E8A24F' : '#1F5C4A'
            }));

            var valTxt = createSvgEl('text', {
              'x': (xPos + barWidth / 2).toFixed(1),
              'y': Math.max(14, yPos - 6).toFixed(1),
              'text-anchor': 'middle',
              'font-size': '11',
              'font-weight': '600',
              'fill': '#1E2A24'
            });
            valTxt.textContent = Math.round(dayAvg).toString();
            svg.appendChild(valTxt);

            var dateLabel = dayData.tanggal ? dayData.tanggal.split('-').pop() : (d + 1).toString();
            var dTxt = createSvgEl('text', {
              'x': (xPos + barWidth / 2).toFixed(1),
              'y': (svgHeight - 10).toString(),
              'text-anchor': 'middle',
              'font-size': '11',
              'fill': '#6F7B74'
            });
            dTxt.textContent = dateLabel;
            svg.appendChild(dTxt);
          }

          chartWrapper.appendChild(svg);
          chartCard.appendChild(chartWrapper);

          var legend = document.createElement('div');
          legend.className = 'chart-legend';

          var leg1 = document.createElement('div');
          leg1.className = 'legend-item';
          var color1 = document.createElement('div');
          color1.className = 'legend-color';
          color1.style.background = '#1F5C4A';
          var text1 = document.createElement('span');
          text1.textContent = 'Rata-rata normal';
          leg1.appendChild(color1);
          leg1.appendChild(text1);
          legend.appendChild(leg1);

          var leg2 = document.createElement('div');
          leg2.className = 'legend-item';
          var color2 = document.createElement('div');
          color2.className = 'legend-color';
          color2.style.background = '#E8A24F';
          var text2 = document.createElement('span');
          text2.textContent = 'Ada bacaan di atas P75';
          leg2.appendChild(color2);
          leg2.appendChild(text2);
          legend.appendChild(leg2);

          chartCard.appendChild(legend);
        }
        rightCol.appendChild(chartCard);

        // Kolom Kanan - Card 4: Catatan Kejadian
        var notesCard = document.createElement('section');
        notesCard.className = 'card card-amber';

        var notesTitle = document.createElement('h2');
        notesTitle.className = 'card-title';
        notesTitle.textContent = 'Catatan Kejadian';
        notesCard.appendChild(notesTitle);

        var typeKeys = Object.keys(catatanPerTipe);
        if (typeKeys.length > 0) {
          var tagList = document.createElement('div');
          tagList.className = 'tag-list';
          for (var t = 0; t < typeKeys.length; t++) {
            var k = typeKeys[t];
            var count = catatanPerTipe[k];
            var tag = document.createElement('div');
            tag.className = 'type-tag';
            tag.textContent = (typeNameMap[k] || k) + ': ' + count;
            tagList.appendChild(tag);
          }
          notesCard.appendChild(tagList);
        }

        if (catatanDaftar.length === 0) {
          var emptyNotes = document.createElement('div');
          emptyNotes.className = 'empty-text';
          emptyNotes.textContent = 'Belum ada catatan kejadian';
          notesCard.appendChild(emptyNotes);
        } else {
          for (var n = 0; n < catatanDaftar.length; n++) {
            var ev = catatanDaftar[n];
            var evItem = document.createElement('div');
            evItem.className = 'event-item';

            var evHeader = document.createElement('div');
            evHeader.className = 'event-header';

            var evType = document.createElement('div');
            evType.className = 'event-type';
            evType.textContent = typeNameMap[ev.tipe] || ev.tipe || 'Kejadian';
            evHeader.appendChild(evType);

            var evTime = document.createElement('div');
            evTime.className = 'event-time';
            evTime.textContent = formatIndonesianDate(ev.waktu);
            evHeader.appendChild(evTime);

            evItem.appendChild(evHeader);

            var evNote = document.createElement('div');
            evNote.className = 'event-note';
            evNote.textContent = ev.catatan || 'Tanpa catatan tambahan';
            evItem.appendChild(evNote);

            notesCard.appendChild(evItem);
          }
        }
        rightCol.appendChild(notesCard);

        contentGrid.appendChild(leftCol);
        contentGrid.appendChild(rightCol);
        app.appendChild(contentGrid);

        // Catatan Kaki
        var footer = document.createElement('footer');
        footer.className = 'footer-note';
        footer.textContent = 'Detak jantung dari jam tangan konsumen; perubahan detak jantung bukan bukti diagnosis. Data ini pelengkap observasi, bukan pengganti penilaian profesional.';
        app.appendChild(footer);
      }
    })();
  </script>
</body>
</html>
